<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokyo Nuclear Explosion Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container">
        <div class="panel">
            <h1>NUKE SIMULATOR</h1>
            <div class="controls">
                <label for="yield-slider">威力 (メガトン): <span id="yield-value">1.0</span> Mt</label>
                <input type="range" id="yield-slider" min="0.1" max="100" step="0.1" value="1.0">
                <button id="detonate-btn">起爆する</button>
            </div>
            <div class="instructions">
                <strong>操作方法:</strong><br>
                W/S: 前後移動<br>
                A/D: 左右移動<br>
                Shift/Ctrl: 上下移動<br>
                矢印キー: 視点移動<br>
            </div>
        </div>
    </div>
    
    <!-- ローカル実行時のCORSエラーを防ぐため、Three.jsをグローバルスクリプトとして読み込みます -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
